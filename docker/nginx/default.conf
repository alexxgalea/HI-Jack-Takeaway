# The only ingress. The api service publishes no host port, which is what makes
# gunicorn's --forwarded-allow-ips='*' safe: the only client that can reach it
# is this proxy, so the X-Forwarded-* headers below are the only ones the app
# will ever see and they are set here rather than accepted from outside.

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # This API takes JSON and small multipart form bodies, nothing resembling an
    # upload. A cap here rejects an oversized body at the proxy rather than
    # spending a gunicorn worker on it.
    client_max_body_size 1m;

    location / {
        proxy_pass http://api;

        # Host first: without it the app would see the upstream name and build
        # wrong absolute URLs. The rest is what the app needs to know the real
        # client and scheme once it is no longer talking to one directly.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connect is short because the upstream is one hop away on the compose
        # network: if it is not accepting connections, failing fast beats
        # holding the client. Read is the generous one - it bounds a slow
        # request, not a missing server.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
