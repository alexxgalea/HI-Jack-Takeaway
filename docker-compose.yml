services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hijack_takeaway
    ports:
      - "5432:5432"
    volumes:
      - hijack_takeaway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hijack_takeaway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hijack_takeaway_pgdata:
