[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "hijack-takeaway"
version = "0.1.0"
description = "Takeaway platform backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "gunicorn==26.2.0",
    "uvicorn-worker==0.4.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.14.0",
    "pwdlib[argon2]==0.3.1",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # ruff format owns line length; it cannot split long comments or generated strings
    "UP042",  # (str, Enum) -> StrEnum changes str(UserRole.user); a behaviour change, not a refactor
    "UP046",  # PEP 695 type params would rewrite a shipped response schema (PaginatedResponse)
    "UP047",  # PEP 695 type params on the _page helper; same reason
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
